# Offline CI: lint, tests, documented-output drift, Terraform validation, secret scan.
# No cloud access and no deployment.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: { python-version: "3.12" }
      - name: Install
        run: uv sync --group dev && uv pip install ruff
      - name: Lint
        run: uv run ruff check .
      - name: Shell script syntax
        run: bash -n scripts/deploy-azure.sh && bash -n scripts/deploy-local.sh
      - name: Validate docker-compose.yml
        run: uv run python -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"
      - name: Tests (offline)
        run: uv run python -m pytest -q
      - name: Documented output matches a fresh run
        run: uv run python scripts/render_docs.py --check

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: infra/terraform }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init (no backend, no cloud credentials)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate -no-color

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
