# Offline CI: lint, tests, documented-output drift, Terraform validation, secret scan.
# No cloud access and no deployment.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: "3.12" }
      - name: Install
        run: uv sync --group dev && uv pip install ruff
      - name: Lint
        run: uv run ruff check .
      - name: Shell script syntax
        run: bash -n scripts/deploy-azure.sh && bash -n scripts/deploy-local.sh
      - name: Validate docker-compose.yml
        run: uv run python -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"
      - name: Tests (offline)
        run: uv run python -m pytest -q
      - name: Documented output matches a fresh run
        run: uv run python scripts/render_docs.py --check

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: infra/terraform }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init (no backend, no cloud credentials)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate -no-color

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
