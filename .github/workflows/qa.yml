name: QA (Playwright E2E)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install service dependencies
        run: |
          pip install pytest pyyaml "agent-framework-core==1.0.1" \
            "agent-framework-openai==1.0.1" "azure-identity>=1.0" \
            fastapi uvicorn pydantic httpx

      - name: Start agent service
        run: |
          SERVICE_RATE_LIMIT_PER_MIN=5 \
            python -m uvicorn food_ingredients_ai.service.app:app \
            --host 127.0.0.1 --port 8000 &
          echo $! > uvicorn.pid

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qa/package-lock.json

      - name: Install QA dependencies
        working-directory: qa
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: qa
        env:
          QA_RATE_LIMIT: "5"
          QA_PYTHON: python
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: qa/playwright-report/
          retention-days: 14

      - name: Stop agent service
        if: always()
        run: kill "$(cat uvicorn.pid)" || true
