name: QA (Playwright E2E)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install service dependencies
        run: |
          pip install pytest pyyaml "agent-framework-core==1.0.1" \
            "agent-framework-openai==1.0.1" "azure-identity>=1.0" \
            fastapi uvicorn pydantic httpx

      - name: Start agent service
        run: |
          SERVICE_RATE_LIMIT_PER_MIN=5 \
            python -m uvicorn food_ingredients_ai.service.app:app \
            --host 127.0.0.1 --port 8000 &
          echo $! > uvicorn.pid

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qa/package-lock.json

      - name: Install QA dependencies
        working-directory: qa
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: qa
        env:
          QA_RATE_LIMIT: "5"
          QA_PYTHON: python
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: qa/playwright-report/
          retention-days: 14

      - name: Stop agent service
        if: always()
        run: kill "$(cat uvicorn.pid)" || true
