apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: food-ingredients-agent-svc
  namespace: food-ingredients-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: food-ingredients-agent-svc
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
