# Kustomize entry point. CI sets the image before `kubectl apply -k`.
# Fill the __PLACEHOLDERS__ in the manifests from Terraform outputs
# (see docs/deployment-runbook.md) before the first manual apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: food-ingredients-ai
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - poddisruptionbudget.yaml
images:
  - name: __ACR_LOGIN_SERVER__/food-ingredients-agentic-ai
    newName: __ACR_LOGIN_SERVER__/food-ingredients-agentic-ai
    newTag: __IMAGE_TAG__
