# Secrets Store CSI driver: inject Key Vault secrets as env vars.
# Requires the Azure provider for the CSI driver installed on AKS.
# Primary auth is workload identity (no secrets needed); this class covers
# the optional AZURE_OPENAI_API_KEY fallback (e.g. non-Azure clusters).
# Replace __KEY_VAULT_NAME__ and __TENANT_ID__ (Terraform outputs / az CLI).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: food-ingredients-kv
  namespace: food-ingredients-ai
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: __WORKLOAD_IDENTITY_CLIENT_ID__
    keyvaultName: __KEY_VAULT_NAME__
    tenantId: __TENANT_ID__
    objects: |
      array:
        - |
          objectName: azure-openai-api-key
          objectType: secret
  secretObjects:
    - secretName: food-ingredients-secrets
      type: Opaque
      data:
        - objectName: azure-openai-api-key
          key: AZURE_OPENAI_API_KEY
