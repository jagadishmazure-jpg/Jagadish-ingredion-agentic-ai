# Workload-identity ServiceAccount for the agent service pod.
# Replace __WORKLOAD_IDENTITY_CLIENT_ID__ with the Terraform output
# `workload_identity_client_id`. The federated credential (created by
# Terraform) trusts: system:serviceaccount:ingredion-ai:ingredion-svc
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingredion-svc
  namespace: ingredion-ai
  annotations:
    azure.workload.identity/client-id: __WORKLOAD_IDENTITY_CLIENT_ID__
  labels:
    azure.workload.identity/use: "true"
