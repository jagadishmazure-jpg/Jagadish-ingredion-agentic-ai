# Example Prometheus alert rules for the agent service.
#
# The service exposes GET /metrics in Prometheus text format (see
# ingredion_ai/service/metrics.py). Point a Prometheus scrape job at the
# service (or at the AKS ServiceMonitor) and load these rules.
#
# Thresholds are demo starting points — tune from the burn-rate guidance
# in docs/monitoring.md before production use.

groups:
  - name: agent-service
    interval: 30s
    rules:
      - alert: AgentServiceDown
        expr: up{job="agent-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Agent service is down"
          description: "No successful scrape of the agent service for 2 minutes."

      - alert: HighErrorRate
        expr: |
          sum(rate(agent_service_errors_total[5m]))
          /
          sum(rate(agent_service_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on the agent service"
          description: "5xx rate above 5% for 5 minutes."

      - alert: HighLatency
        expr: |
          sum(rate(agent_service_http_request_duration_seconds_sum[5m]))
          /
          sum(rate(agent_service_http_request_duration_seconds_count[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High average request latency"
          description: "Average request latency above 5s for 10 minutes."

      - alert: LiveFallbackStorm
        expr: |
          sum(increase(agent_service_live_fallback_total[15m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Repeated live-LLM fallbacks to offline mode"
          description: "More than 10 graceful degradations in 15 minutes — check Azure OpenAI health and quota."

      - alert: NoAgentRuns
        expr: |
          sum(increase(agent_service_agent_runs_total[30m])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No agent runs in 30 minutes"
          description: "Traffic may have stopped or the pipeline may be failing before agent execution."
