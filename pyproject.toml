[project]
name = "jagadish-ingredion-agentic-ai"
version = "0.1.0"
description = "Multi-agent AI demo for clean-label ingredient manufacturing. 100% synthetic demo data; independent portfolio project, not affiliated with Ingredion."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
dependencies = ["pyyaml>=6.0", "agent-framework-core==1.0.1", "agent-framework-openai==1.0.1", "azure-identity>=1.0", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingredion_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
